<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#145b86">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>お題目帳</title>
<style>
:root{
  --bg:#f2f5f8;--card:#fff;--ink:#1d2b38;--sub:#6a7a8b;--line:#e2e8ee;
  --pri:#1491cc;--pri2:#0c6fa3;--navy:#145b86;--soft:#e8f4fb;--warn:#d9534f;--ok:#2e9d5b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Noto Sans CJK JP","Yu Gothic",system-ui,sans-serif;
  font-size:16px;line-height:1.55}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
rt{font-size:.5em;font-weight:500;letter-spacing:0;opacity:.85}
ruby{ruby-position:over}
.wrap{max-width:540px;margin:0 auto;padding:0 12px calc(86px + env(safe-area-inset-bottom))}

/* header */
#hdr{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top)}
.hd{max-width:540px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:10px 14px}
.hd .ttl{font-size:19px;font-weight:700;letter-spacing:.04em;flex:1}
.mode{font-size:11px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.16);white-space:nowrap}
.mode.local{background:#f0a030;color:#3a2500}
.me{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.18);border-radius:99px;padding:4px 10px 4px 4px;font-size:14px;color:#fff}
.me .av{width:26px;height:26px;font-size:15px}

/* nav */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 8px;font-size:11px;color:#94a2b0}
#tabs button .ic{font-size:21px;line-height:1.2;filter:grayscale(1);opacity:.6}
#tabs button.on{color:var(--navy);font-weight:700}
#tabs button.on .ic{filter:none;opacity:1}

.card{background:var(--card);border-radius:18px;padding:16px;margin-top:12px;box-shadow:0 1px 3px rgba(20,60,90,.06)}
.cttl{font-size:15px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:6px}
.cttl small{font-weight:400;color:var(--sub);margin-left:auto;font-size:12px}
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;flex:none}

/* home band */
.band{margin-top:12px;border-radius:20px;padding:14px 14px 12px;color:#fff;
  background:linear-gradient(135deg,#1aa0d8 0%,#1478b8 55%,#145b86 100%);box-shadow:0 4px 14px rgba(20,100,160,.25)}
.band .bt{font-size:12.5px;opacity:.9;text-align:center}
.band .bbig{text-align:center;font-size:26px;font-weight:700;line-height:1.3}
.band .bbig small{display:block;font-size:13px;font-weight:500;opacity:.9}
.band .bsub{font-size:12.5px;opacity:.9;margin:10px 0 6px;display:flex;justify-content:space-between}
.fam3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fcell{background:rgba(255,255,255,.14);border-radius:14px;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;color:#fff;position:relative;min-height:118px}
.fcell.mine{background:rgba(255,255,255,.24)}
.fcell .av{width:40px;height:40px;font-size:22px;border:2px solid rgba(255,255,255,.85)}
.fcell .chk{position:absolute;top:6px;right:8px;background:#fff;color:var(--ok);border-radius:50%;width:20px;height:20px;font-size:13px;font-weight:700;display:grid;place-items:center}
.fcell .fn{font-size:13px;font-weight:700;margin-top:3px}
.fcell .fv{font-size:15px;font-weight:700;line-height:1.25;text-align:center}
.fcell .fv small{display:block;font-size:11px;font-weight:400;opacity:.9}
.fcell .none{font-size:12px;opacity:.75}
.fcell .fnow{font-size:11px;min-height:16px;color:#fff;text-align:center}
.fcell .fnow b{display:inline-block;width:7px;height:7px;background:#ff5a5a;border-radius:50%;margin-right:3px;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* timer */
.trow{display:flex;align-items:center;gap:8px}
.seg{display:flex;background:#eef2f5;border-radius:12px;padding:3px;flex:1}
.seg button{flex:1;padding:7px 4px;border-radius:9px;font-size:14px;color:#556}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.icobtn{width:42px;height:42px;border-radius:50%;background:#eef2f5;font-size:19px;flex:none}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.presets button{padding:5px 11px;border-radius:99px;background:#eef2f5;font-size:13px}
.presets button.on{background:var(--pri);color:#fff;font-weight:700}
.dial{position:relative;width:min(290px,78vw);aspect-ratio:1;margin:8px auto 0}
.dial svg{width:100%;height:100%;display:block}
.dial .bgarc{fill:none;stroke:#e9eef2;stroke-width:16;stroke-linecap:round}
.dial .fgarc{fill:none;stroke:var(--pri);stroke-width:16;stroke-linecap:round;transition:stroke-dasharray .25s linear}
.dialin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:6px}
#big{font-size:clamp(40px,12.5vw,58px);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em;line-height:1.1;font-family:"SF Pro Rounded","Roboto",system-ui,sans-serif}
#hen{font-size:22px;font-weight:700;color:#3d5366;margin-top:2px;font-variant-numeric:tabular-nums}
#tsub{font-size:12px;color:var(--sub);margin-top:4px;text-align:center;min-height:18px}
.btns{display:flex;justify-content:space-between;align-items:center;margin-top:-14px;padding:0 4px}
.cbtn{width:76px;height:76px;border-radius:50%;background:#eef2f5;font-size:15px;font-weight:600}
.cbtn:active,.mbtn:active{transform:scale(.96)}
.mbtn{width:116px;height:116px;border-radius:50%;background:var(--pri);color:#fff;font-size:21px;font-weight:700;box-shadow:0 6px 16px rgba(20,145,204,.35)}
.mbtn.run{background:#e8604f;box-shadow:0 6px 16px rgba(232,96,79,.35)}
.mytot{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mytot div{background:var(--soft);border-radius:12px;padding:8px 10px}
.mytot small{display:block;color:var(--sub);font-size:11.5px}
.mytot b{font-size:16px}
.mytot i{font-style:normal;display:block;font-size:12px;color:#3d5366}

/* stats */
.chips{display:flex;gap:6px;margin-top:12px;overflow-x:auto;padding-bottom:2px}
.chips button{flex:none;display:flex;align-items:center;gap:4px;padding:5px 12px 5px 5px;border-radius:99px;background:#fff;border:1.5px solid var(--line);font-size:14px}
.chips button .av{width:24px;height:24px;font-size:14px}
.chips button.on{border-color:var(--c,var(--navy));background:var(--c,var(--navy));color:#fff;font-weight:700}
.subtabs{display:grid;grid-template-columns:repeat(4,1fr);margin-top:10px;background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.subtabs button{padding:9px 0;font-size:14px;color:#8795a3;border-bottom:3px solid transparent}
.subtabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--pri)}
.nav{display:flex;align-items:center;justify-content:center;gap:16px;margin:2px 0 8px}
.nav b{font-size:17px;min-width:120px;text-align:center}
.nav button{width:34px;height:34px;border-radius:50%;background:var(--pri);color:#fff;font-size:16px;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal .wh{text-align:center;font-size:12px;color:var(--sub);padding-bottom:2px}
.cal .wh.su,.cd.su .dn{color:#d9534f}.cal .wh.sa,.cd.sa .dn{color:#2b7bd6}
.cd{display:flex;flex-direction:column;align-items:center;padding:3px 0 2px;border-radius:10px;min-height:52px}
.cd .dots{height:8px;display:flex;gap:2px}
.cd .dots i{width:7px;height:7px;border-radius:50%;display:block}
.cd .dn{font-size:15px;line-height:1.5}
.cd .dm{font-size:10px;color:var(--pri2);font-weight:700;line-height:1}
.cd.td .dn{background:var(--navy);color:#fff!important;border-radius:50%;width:26px;height:24px;display:grid;place-items:center}
.cd.sel{background:var(--soft);outline:2px solid var(--pri)}
.cd.fu .dn{color:#b5c0ca}
.tot{display:flex;justify-content:space-between;align-items:center;padding:4px 2px}
.tot .tv{text-align:right;font-weight:700;font-size:18px;line-height:1.3}
.tot .tv small{display:block;font-size:13px;color:var(--sub);font-weight:500}
.tl{margin:6px 0 4px}
.lane{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.lane .ln{width:40px;font-size:12px;text-align:right;flex:none}
.lane .bar{position:relative;flex:1;height:18px;background:#eef2f5;border-radius:6px;overflow:hidden;
  background-image:linear-gradient(to right,transparent calc(25% - 1px),#d9e1e8 calc(25% - 1px),#d9e1e8 25%,transparent 25%,transparent calc(50% - 1px),#d9e1e8 calc(50% - 1px),#d9e1e8 50%,transparent 50%,transparent calc(75% - 1px),#d9e1e8 calc(75% - 1px),#d9e1e8 75%,transparent 75%)}
.lane .bar i{position:absolute;top:2px;bottom:2px;border-radius:4px;min-width:4px}
.tlax{display:flex;justify-content:space-between;font-size:10px;color:var(--sub);margin-left:0}
.tlax.ind{margin-left:46px}
.recs{margin-top:8px}
.rec{display:flex;align-items:center;gap:8px;padding:9px 2px;border-top:1px solid var(--line)}
.rec .rt{font-variant-numeric:tabular-nums;font-size:14px;min-width:94px;color:#3d5366}
.rec .rw{font-size:13px;font-weight:700}
.rec .rv{flex:1;text-align:right;font-weight:700;font-size:15px;line-height:1.3}
.rec .rv small{display:block;font-weight:400;font-size:12px;color:var(--sub)}
.rec .ed{width:36px;height:36px;border-radius:50%;background:#eef2f5;font-size:15px;flex:none}
.rmemo{font-size:12.5px;color:var(--sub);padding:0 4px 8px 4px;margin-top:-4px}
.tag{font-size:10px;background:#fff3dd;color:#a76a00;border-radius:6px;padding:1px 5px}
.addbtn{width:100%;margin-top:10px;padding:11px;border-radius:12px;border:1.5px dashed var(--pri);color:var(--pri2);font-weight:700;background:#f6fbfe}
.dlist .di{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.dlist .dc{width:52px;height:52px;border-radius:50%;background:var(--pri);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1.1}
.dlist .dc b{font-size:19px}.dlist .dc small{font-size:10px}
.dlist .dv{flex:1}
.dlist .dv b{font-size:16px}
.dlist .dv small{display:block;color:var(--sub);font-size:13px}
.pp{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.pp span{font-size:11px;border-radius:6px;padding:0 5px;color:#fff}
.sorter{font-size:13px;color:var(--pri2);font-weight:700}
.mchart{width:100%;height:auto;display:block}
.mchart .gl{stroke:#e8edf2;stroke-width:1}
.mchart .ax{font-size:10px;fill:#7b8a99}
.mchart .bv{font-size:9.5px;fill:#0c6fa3;font-weight:700}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-top:1px solid var(--line);width:100%;text-align:left}
.mrow .tv{text-align:right;font-weight:700;line-height:1.3}
.mrow .tv small{display:block;font-size:12.5px;color:var(--sub);font-weight:500}
.legend{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--sub);justify-content:flex-end;margin-bottom:6px}
.legend i{width:13px;height:13px;border-radius:3px;display:inline-block}
.ygrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.ymh{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
.ymh small{color:var(--sub);font-size:11px}
.yg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:3px}
.yg .w{font-size:8.5px;color:#9aa7b3;text-align:center;line-height:1.2}
.yg i{display:block;aspect-ratio:1.25;border-radius:4px;background:#e8edf2}
.yg i.e{background:transparent}
.yg i.l1,.yg i.l2,.yg i.l3,.yg i.l4{background:var(--hc)}
.yg i.l1{opacity:.3}.yg i.l2{opacity:.55}.yg i.l3{opacity:.8}.yg i.l4{opacity:1}
.yg i.td{outline:2px solid var(--ink);outline-offset:-1px}
.yg i.fu{background:#f4f6f8}
.lg i.l1{opacity:.3}.lg i.l2{opacity:.55}.lg i.l3{opacity:.8}
.field{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.field input[type=date]{border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:#fff}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.quick button{padding:5px 12px;border-radius:99px;background:#eef2f5;font-size:13px}
.big2{text-align:right;font-size:30px;font-weight:700;line-height:1.25}
.big2 small{display:block;font-size:22px;color:#3d5366}
.brk{margin-top:10px}
.brk .br{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.brk .br .bb{flex:1;height:12px;background:#eef2f5;border-radius:6px;overflow:hidden}
.brk .br .bb i{display:block;height:100%;border-radius:6px}
.brk .br .bvv{min-width:120px;text-align:right}
.note{font-size:12.5px;color:var(--sub);margin-top:8px}

/* prayers */
.pcount{font-size:11px;background:rgba(0,0,0,.08);border-radius:99px;padding:0 6px;margin-left:3px}
.tg{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13.5px;color:#3d5366}
.sw{width:44px;height:26px;border-radius:99px;background:#cfd8e0;position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--pri)}.sw.on::after{left:21px}
.pcard{background:#fff;border-radius:16px;padding:14px 14px 12px;margin-top:10px;border-left:5px solid var(--c);box-shadow:0 1px 3px rgba(20,60,90,.06)}
.pcard .ph{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
.pcard .ph .av{width:22px;height:22px;font-size:12px}
.pcard .ph .vis{margin-left:auto}
.pcard h4{margin:6px 0 2px;font-size:17px;line-height:1.45}
.pcard .pb{white-space:pre-wrap;font-size:14px;color:#3d4c5a;margin:4px 0}
.pcard .due{font-size:13px;color:var(--pri2);margin-top:4px}
.pcard .due .over{color:var(--warn);font-weight:700}
.pcard .res{margin-top:8px;padding:8px 10px;border-radius:10px;font-size:13.5px}
.pcard .res.yes{background:#e8f6ee;color:#1f7a45}.pcard .res.no{background:#f3f1f1;color:#6b5f5f}
.pact{display:flex;gap:8px;margin-top:10px}
.pact button{flex:1;padding:8px 4px;border-radius:10px;font-size:14px;font-weight:700}
.pact .y{background:#e8f6ee;color:#1f7a45}.pact .n{background:#f1f3f5;color:#5d6b78}.pact .e{flex:none;width:44px;background:#eef2f5}
.bigbtn{display:block;width:100%;margin:16px 0 4px;padding:14px;border-radius:99px;background:var(--pri);color:#fff;font-size:17px;font-weight:700;box-shadow:0 4px 12px rgba(20,145,204,.3)}
.empty{text-align:center;color:var(--sub);padding:34px 10px 10px;font-size:14px}
.empty .ei{font-size:52px;display:block;margin-bottom:4px}

/* prayers v2 */
.ptop .ptoday{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.ptop .ptoday b{font-size:22px;color:var(--pri2)}
.pcat .cttl{flex-wrap:wrap;margin-bottom:4px}
.pcat .cttl small{width:100%;margin-left:0;font-size:11.5px}
.cico{font-size:20px}
.prow{display:flex;align-items:flex-start;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.ck{display:flex;flex-direction:column;align-items:center;gap:1px;width:42px;flex:none}
.ck .bx{width:30px;height:30px;border-radius:8px;border:2px solid #b9c6d2;display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff;background:#fff}
.ck .cl{font-size:10.5px;color:var(--sub);line-height:1.3}
.ck.k1.on .bx{background:var(--pri);border-color:var(--pri)}
.ck.k2.on .bx{background:var(--ok);border-color:var(--ok)}
.ck[disabled]{opacity:.7;cursor:default}
.prow .pt{flex:1;text-align:left;min-width:0;padding:3px 0 0 4px}
.prow .pt b{display:block;font-size:15px;line-height:1.45;word-break:break-word}
.prow .pbd{font-size:12.5px;color:#4d5d6c;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prow .pm{display:block;font-size:11.5px;color:var(--sub);margin-top:2px}
.prow .pm .sep{font-style:normal;opacity:.5}
.prow .pm .over{color:var(--warn);font-weight:700}
.prow.ach .pt b{color:#1f7a45}
.prow.ng{opacity:.55}
.star{width:34px;height:34px;font-size:22px;color:#c8d1da;flex:none}
.star.on{color:#f4b400}
.star[disabled]{cursor:default}
.pempty{font-size:13px;color:var(--sub);padding:8px 0 2px;border-top:1px solid var(--line)}
.padd{margin-top:6px;font-size:13.5px;font-weight:700;color:var(--pri2);padding:6px 2px}
.catsel{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.catsel button{display:flex;align-items:center;gap:6px;padding:10px;border-radius:12px;border:1.5px solid var(--line);font-weight:700;text-align:left}
.catsel button.on{border-color:var(--pri);background:var(--soft)}
.pgo{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font-weight:700}
.pgo b{margin-left:auto;font-size:20px;color:var(--pri2)}
.pgo .arr{color:var(--sub);font-size:22px}

/* voice / import */
.micbig{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;padding:12px;border-radius:14px;background:linear-gradient(135deg,#1aa0d8,#1478b8);color:#fff;font-weight:700;font-size:16px;box-shadow:0 3px 10px rgba(20,120,184,.3)}
.micbig span{font-size:22px}
.vmic{display:block;margin:6px auto 4px;width:92px;height:92px;border-radius:50%;background:#eef2f5;font-size:42px}
.vmic.on{background:#e8604f;box-shadow:0 0 0 0 rgba(232,96,79,.5);animation:ring 1.4s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(232,96,79,.5)}100%{box-shadow:0 0 0 22px rgba(232,96,79,0)}}
.vst{text-align:center;font-size:13px;color:var(--sub);min-height:20px;margin-bottom:8px}
.vex{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.7;background:#f6f8fa;border-radius:10px;padding:8px 10px}
.heard{font-size:13px;color:#4d5d6c;background:#f6f8fa;border-radius:10px;padding:8px 10px;margin-bottom:6px;word-break:break-word}
.cmp{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:700}
.cmp small{display:block;font-weight:400;color:var(--sub);font-size:11.5px}
.cmp.to{border-color:var(--pri);background:var(--soft)}
.cmp.to.del{border-color:var(--warn);background:#fdecea;color:var(--warn)}
.cmparr{text-align:center;color:var(--sub);font-size:18px;margin:4px 0}
.vpick{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.vpick button{text-align:left;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);font-weight:700}
.fmic{display:flex!important;align-items:center;justify-content:space-between}
.mini{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--pri2)}
.mini.on{background:#e8604f;color:#fff;animation:pulse 1.2s infinite}
.ioline{display:flex;gap:8px;margin-top:10px}

<body>
<header id="hdr"></header>

<nav id="tabs"></nav>

<div id="viewer"></div>
<script type="module">
/* ============================================================
   お題目帳(家族3人で共有する唱題記録アプリ)
   1分あたりの遍数は人ごとに設定(普通60・早め67・自分で入力)。過去の記録も今の設定で計算
   ============================================================ */
const COL = 'daimoku-family';
const FB_VER = '10.12.2';
const CFG = {
  apiKey: "AIzaSyD1sbGfrdUw6HoKlWNWl099-JMzlwfRMLs",
  authDomain: "dokuryo-cho.firebaseapp.com",
  projectId: "dokuryo-cho",
  storageBucket: "dokuryo-cho.firebasestorage.app",
  messagingSenderId: "851503769517",
  appId: "1:851503769517:web:71f1616be8b5d3ea982324"
};
const RATE_DEFAULT = 60, RATE_PRESETS = [['normal', '{普通|ふつう}', 60], ['fast', '{早|はや}め', 67]];
const rateOf = who => { const r = DOCS.settings && DOCS.settings.rate && DOCS.settings.rate[who]; return (r >= 1 && r <= 300) ? +r : RATE_DEFAULT; };
const hen = (sec, who) => Math.floor(Math.max(0, sec) * rateOf(who || L.me) / 60);

const PEOPLE = [
  { id: 'papa',  name: 'パパ', rb: 'パパ',            color: '#2b7bd6', emoji: '👨' },
  { id: 'mama',  name: 'ママ', rb: 'ママ',            color: '#e0607e', emoji: '👩' },
  { id: 'aisei', name: '藍世', rb: '{藍世|あいせい}', color: '#f0a030', emoji: '👦' },
];
const P = id => PEOPLE.find(p => p.id === id) || PEOPLE[0];

const LOCAL_ONLY = new URLSearchParams(location.search).has('local');
const K = s => 'odaimoku-' + s + (LOCAL_ONLY ? '-test' : '');
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

let L = Object.assign({ me: null, furi: null, goal: 10, sound: true }, lsGet(K('local'), {}));
const saveL = () => lsSet(K('local'), L);
const furiOn = () => (L.furi === null || L.furi === undefined) ? L.me === 'aisei' : !!L.furi;

/* ---------- ふりがな ---------- */
const RB = /\{([^{}|]+)\|([^{}]+)\}/g;
const T = s => s.replace(RB, (m, k, r) => furiOn() ? `<ruby>${k}<rt>${r}</rt></ruby>` : k);
const plain = s => s.replace(RB, '$1');
const esc = s => String(s ?? '').replace(/[&<>"'{}]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '{': '&#123;', '}': '&#125;' }[c]));
const DAYR = { 1: 'ついたち', 2: 'ふつか', 3: 'みっか', 4: 'よっか', 5: 'いつか', 6: 'むいか', 7: 'なのか', 8: 'ようか', 9: 'ここのか', 10: 'とおか', 14: 'じゅうよっか', 20: 'はつか', 24: 'にじゅうよっか' };
const dayRb = d => DAYR[d] ? `{${d}日|${DAYR[d]}}` : `${d}{日|にち}`;
const daysRb = n => n === 1 ? `{1日|いちにち}` : dayRb(n);
const fun = n => (n > 0 && [0, 1, 3, 4, 6, 8].includes(n % 10)) ? 'ぷん' : 'ふん';
const ben = n => { if (n > 0 && n % 1000 === 0) return 'べん'; const l = n % 10; if (n > 0 && [0, 1, 6, 8].includes(l)) return 'ぺん'; if (l === 3) return 'べん'; return 'へん'; };
const WD = ['日', '月', '火', '水', '木', '金', '土'], WDR = ['にち', 'げつ', 'か', 'すい', 'もく', 'きん', 'ど'];
const wdRb = i => `{${WD[i]}|${WDR[i]}}`;

/* ---------- 表示用 ---------- */
const pad = n => String(n).padStart(2, '0');
const ymd = dt => `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
const today = () => ymd(new Date());
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const dateRb = s => { const dt = parseD(s); return `${dt.getMonth() + 1}{月|がつ}${dayRb(dt.getDate())}(${wdRb(dt.getDay())})`; };
const ymRb = ym => { const [y, m] = ym.split('-').map(Number); return `${y}{年|ねん}${m}{月|がつ}`; };
const dispT = s => s.replace(/^0(\d)/, '$1');
const endT = r => { const [h, m] = r.s.split(':').map(Number); const t = (h * 60 + m + Math.round(r.sec / 60)) % 1440; return `${Math.floor(t / 60)}:${pad(t % 60)}`; };
const hms = sec => { sec = Math.floor(sec); return `${pad(Math.floor(sec / 3600))}:${pad(Math.floor(sec % 3600 / 60))}:${pad(sec % 60)}`; };
function fmtDur(sec) {
  sec = Math.max(0, Math.round(sec));
  if (sec < 60) return sec > 0 ? `${sec}{秒|びょう}` : `0{分|ふん}`;
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);
  if (h > 0) return `${h}{時間|じかん}${m ? `${m}{分|${fun(m)}}` : ''}`;
  return `${m}{分|${fun(m)}}`;
}
function fmtHen(n, exact) {
  if (!exact && n >= 10000) {
    const v = n / 10000, s = v >= 100 ? String(Math.round(v)) : v.toFixed(1).replace(/\.0$/, '');
    return `${s}{万遍|まんべん}`;
  }
  return `${n.toLocaleString('ja-JP')}{遍|${ben(n)}}`;
}
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ============================================================
   データ(Firestore:コレクション daimoku-family)
   rec_<だれ>_<yyyymm> : { recs: { id: {who,d,s,sec,memo,m,at} } }
   prayers             : { items: { id: {...} } }
   live                : { papa: {rs,acc,at} | null, ... }
   ============================================================ */
let DOCS = lsGet(K('cache'), {});
let PENDING = lsGet(K('pending'), []);
let MODE = LOCAL_ONLY ? 'local' : 'connecting', MODE_NOTE = LOCAL_ONLY ? 'テストモード(?local=1)' : '';
let fs = null, db = null;
let RECS = [], BYDAY = {};

function rebuild() {
  RECS = [];
  for (const [id, doc] of Object.entries(DOCS)) {
    if (!id.startsWith('rec_') || !doc || !doc.recs) continue;
    for (const [rid, r] of Object.entries(doc.recs)) if (r && r.d && r.who) RECS.push({ ...r, id: rid });
  }
  RECS.sort((a, b) => (a.d + a.s).localeCompare(b.d + b.s));
  BYDAY = {};
  for (const r of RECS) (BYDAY[r.d] || (BYDAY[r.d] = [])).push(r);
}
const recsOf = (who, d) => (BYDAY[d] || []).filter(r => who === 'all' || r.who === who);
const recsWhere = (who, f) => RECS.filter(r => (who === 'all' || r.who === who) && f(r));
const sumSec = a => a.reduce((x, r) => x + (r.sec || 0), 0);
const sumHen = a => a.reduce((x, r) => x + hen(r.sec || 0, r.who), 0);
const prayers = () => Object.entries((DOCS.prayers && DOCS.prayers.items) || {}).filter(([, v]) => v).map(([id, v]) => ({ ...v, id }));
const recDoc = r => `rec_${r.who}_${r.d.slice(0, 7).replace('-', '')}`;
const saveCache = () => lsSet(K('cache'), DOCS);

function deepMerge(t, src) {
  const o = (t && typeof t === 'object' && !Array.isArray(t)) ? { ...t } : {};
  for (const [k, v] of Object.entries(src)) o[k] = (v && typeof v === 'object' && !Array.isArray(v)) ? deepMerge(o[k], v) : v;
  return o;
}
function applyLocal(o) {
  if (o.t === 'merge') { DOCS[o.doc] = deepMerge(DOCS[o.doc] || {}, o.data); return; }
  if (o.t === 'del' && DOCS[o.doc]) {
    const parts = o.path.split('.'), root = { ...DOCS[o.doc] }; let cur = root;
    for (let i = 0; i < parts.length - 1; i++) {
      if (!cur[parts[i]] || typeof cur[parts[i]] !== 'object') return;
      cur[parts[i]] = { ...cur[parts[i]] }; cur = cur[parts[i]];
    }
    delete cur[parts[parts.length - 1]]; DOCS[o.doc] = root;
  }
}
function remote(o) {
  if (!fs || !db) return Promise.reject(new Error('no db'));
  if (o.t === 'photo') return IDB.get(o.key).then(d => d ? fs.setDoc(fs.doc(db, COL, o.key), { d, at: Date.now() }) : null);
  if (o.t === 'pdel') return fs.deleteDoc(fs.doc(db, COL, o.key));
  const ref = fs.doc(db, COL, o.doc);
  if (o.t === 'merge') return fs.setDoc(ref, o.data, { merge: true });
  return fs.updateDoc(ref, { [o.path]: fs.deleteField() }).catch(e => { if (e && e.code === 'not-found') return; throw e; });
}
function queue(o) { if (o.live || LOCAL_ONLY) return; PENDING.push(o); lsSet(K('pending'), PENDING); }
function op(o, quiet) {
  applyLocal(o); rebuild(); saveCache();
  if (MODE === 'cloud') remote(o).catch(e => { console.warn('write failed', e); queue(o); });
  else queue(o);
  if (!quiet) render();
}
async function flush() {
  if (!PENDING.length) return;
  const list = PENDING; PENDING = []; lsSet(K('pending'), []);
  for (const o of list) {
    try { await Promise.race([remote(o), new Promise(r => setTimeout(r, 3000))]); }
    catch (e) { console.warn(e); queue(o); }
  }
}
function setMode(m, note) { MODE = m; MODE_NOTE = note || ''; renderHeader(); if (CUR === 'set') render(); }

async function initFirebase() {
  if (LOCAL_ONLY) return;
  try {
    const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 10000));
    const [A, F] = await Promise.race([Promise.all([
      import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-app.js`),
      import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-firestore.js`)]), timeout]);
    const app = A.initializeApp(CFG, 'odaimoku-cho');
    let d;
    try { d = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
    catch (e) { d = F.getFirestore(app); }
    fs = F; db = d;
    const slow = setTimeout(() => { if (MODE !== 'cloud') setMode('local', 'つながるまで、この端末に保存しています'); }, 12000);
    let unsub = null;
    unsub = F.onSnapshot(F.query(F.collection(db, COL), F.where(F.documentId(), '<', 'zz')), { includeMetadataChanges: true }, snap => {
      const nd = {}; snap.forEach(x => nd[x.id] = x.data());
      const fromCache = snap.metadata.fromCache;
      if (!(fromCache && snap.empty && Object.keys(DOCS).length)) { DOCS = nd; rebuild(); saveCache(); }
      clearTimeout(slow);
      const wasCloud = MODE === 'cloud';
      MODE = 'cloud'; MODE_NOTE = fromCache ? 'オフライン中(つながったら送ります)' : '';
      if (!wasCloud) flush();
      if (!fromCache) seedPrayers();
      renderHeader(); render();
    }, err => {
      clearTimeout(slow); console.warn(err);
      setMode('local', err && err.code === 'permission-denied'
        ? 'Firestoreのルールに daimoku-family が追加されていません'
        : 'クラウドにつながりません(' + (err && err.code || 'error') + ')');
      if (unsub) unsub();
    });
  } catch (e) {
    console.warn(e);
    setMode('local', 'インターネットにつながっていません');
  }
}

/* ============================================================
   ストップウォッチ/タイマー
   ============================================================ */
let TS = Object.assign({ mode: 'sw', running: false, acc: 0, rs: 0, first: 0, target: 10 }, lsGet(K('timer'), {}));
const saveTS = () => lsSet(K('timer'), TS);
const elapsed = () => TS.acc + (TS.running ? (Date.now() - TS.rs) / 1000 : 0);
const tgtSec = () => TS.target * 60;

function setLive(on) {
  if (MODE !== 'cloud' || !L.me) return;
  op({ t: 'merge', doc: 'live', live: true, data: { [L.me]: on ? { rs: TS.rs, acc: TS.acc, at: Date.now() } : null } }, true);
}
function liveOf(id) {
  const l = DOCS.live && DOCS.live[id];
  if (!l || !l.rs || Date.now() - l.rs > 4 * 3600e3) return null;
  return (l.acc || 0) + (Date.now() - l.rs) / 1000;
}
let AC = null;
function ensureAudio() { try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) {} }
function bell() {
  if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
  if (!L.sound || !AC) return;
  [0, 1.4].forEach(delay => {
    const t = AC.currentTime + delay;
    [[523.25, 1], [1046.5, .45], [1568, .2], [2093, .1]].forEach(([f, g]) => {
      const o = AC.createOscillator(), v = AC.createGain();
      o.type = 'sine'; o.frequency.value = f;
      v.gain.setValueAtTime(0.0001, t); v.gain.exponentialRampToValueAtTime(0.35 * g, t + 0.015);
      v.gain.exponentialRampToValueAtTime(0.0001, t + 3.2);
      o.connect(v).connect(AC.destination); o.start(t); o.stop(t + 3.3);
    });
  });
}
let WL = null;
async function wake(on) {
  try {
    if (on && 'wakeLock' in navigator) { if (!WL) { WL = await navigator.wakeLock.request('screen'); WL.addEventListener('release', () => { WL = null; }); } }
    else if (!on && WL) { await WL.release(); WL = null; }
  } catch (e) {}
}
function tStart() {
  ensureAudio();
  if (!L.me) return whoModal();
  if (TS.mode === 'tm' && elapsed() >= tgtSec()) { toast('タイマーが おわっています。{保存|ほぞん}か リセットしてね'); return; }
  const now = Date.now();
  if (!TS.first) TS.first = now;
  TS.running = true; TS.rs = now; saveTS(); wake(true); setLive(true); tick();
}
function tStop() {
  if (!TS.running) return;
  TS.acc += (Date.now() - TS.rs) / 1000;
  if (TS.mode === 'tm') TS.acc = Math.min(TS.acc, tgtSec());
  TS.running = false; saveTS(); wake(false); setLive(false); tick();
}
function tClear() { Object.assign(TS, { running: false, acc: 0, rs: 0, first: 0 }); saveTS(); wake(false); }
function tReset() {
  if (elapsed() >= 10 && !confirm('保存しないで 0 にもどしますか?')) return;
  const wasRun = TS.running; tClear(); if (wasRun) setLive(false); render();
}
function tSave() {
  if (TS.running) tStop();
  const sec = Math.floor(elapsed());
  if (sec < 1) { toast('まだ{記録|きろく}がありません'); return; }
  if (!L.me) return whoModal();
  const st = new Date(TS.first || (Date.now() - sec * 1000));
  const rec = { who: L.me, d: ymd(st), s: `${pad(st.getHours())}:${pad(st.getMinutes())}`, sec, memo: '', m: false, at: Date.now() };
  tClear();
  op({ t: 'merge', doc: recDoc(rec), data: { recs: { [newId()]: rec } } });
  toast(`{保存|ほぞん}しました! ${fmtDur(sec)}・${fmtHen(hen(sec, rec.who), true)}`);
}

const ARC_R = 110, ARC_C = 2 * Math.PI * ARC_R, ARC_L = ARC_C * 0.75;
function tick() {
  const tm = TS.mode === 'tm', tgt = tgtSec();
  if (tm && TS.running && elapsed() >= tgt) {
    TS.acc = tgt; TS.running = false; saveTS(); wake(false); setLive(false); bell();
    toast('タイマー{終了|しゅうりょう}! {保存|ほぞん}を おしてね');
  }
  if (CUR !== 'home') return;
  const e = Math.min(elapsed(), tm ? tgt : Infinity);
  const big = document.getElementById('big'); if (!big) return;
  big.textContent = hms(tm ? Math.max(0, tgt - e) : e);
  document.getElementById('hen').innerHTML = T(fmtHen(hen(Math.floor(e)), true));
  let p, sub;
  if (tm) {
    p = tgt ? e / tgt : 0;
    sub = `{経過|けいか} ${hms(e).slice(3)} / ${TS.target}{分|${fun(TS.target)}}`;
  } else {
    const done = sumSec(recsOf(L.me, today())) + e, goal = L.goal * 60;
    p = goal ? Math.min(1, done / goal) : 0;
    const left = Math.ceil((goal - done) / 60);
    sub = goal ? (done >= goal ? `きょうの{目標|もくひょう}たっせい! 🎉` : `きょうの{目標|もくひょう} ${L.goal}{分|${fun(L.goal)}}まで あと${left}{分|${fun(left)}}`) : '';
  }
  const arc = document.getElementById('arc');
  arc.setAttribute('stroke-dasharray', `${(ARC_L * p).toFixed(1)} ${ARC_C.toFixed(1)}`);
  arc.style.opacity = p > 0 ? 1 : 0;
  document.getElementById('tsub').innerHTML = T(sub);
  const b = document.getElementById('bStart');
  b.textContent = TS.running ? 'ストップ' : (elapsed() > 0 && !(tm && e >= tgt) ? 'つづける' : 'スタート');
  b.classList.toggle('run', TS.running);
  for (const pp of PEOPLE) {
    const el = document.getElementById('fnow-' + pp.id); if (!el) continue;
    const lv = pp.id === L.me ? (TS.running ? elapsed() : null) : liveOf(pp.id);
    el.innerHTML = lv !== null ? T(`<b></b>{唱題中|しょうだいちゅう} ${hms(lv).replace(/^00:/, '')}`) : '';
  }
}
setInterval(tick, 250);

}

    <button class="addbtn" data-act="addrec" data-v="${ds}">＋ {手入力|てにゅうりょく}で{追加|ついか}</button>

function monthChart(y) {
  const lanes = ST.who === 'all' ? PEOPLE : [P(ST.who)];
  const data = Array.from({ length: 12 }, (_, i) => { const ym = `${y}-${pad(i + 1)}`; return lanes.map(p => sumSec(RECS.filter(r => r.who === p.id && r.d.startsWith(ym))) / 3600); });
  const tot = data.map(a => a.reduce((x, v) => x + v, 0));
  const mx = Math.max(0, ...tot);
  const top = mx <= 0 ? 1 : mx <= 1 ? 1 : mx <= 4 ? 4 : Math.ceil(mx / 4) * 4;
  const W = 340, H = 200, L0 = 30, R0 = 4, T0 = 18, B0 = 20, cw = (W - L0 - R0) / 12, bw = cw * .66, ch = H - T0 - B0;
  const nf = v => (Math.round(v * 100) / 100).toString();
  let s = `<svg viewBox="0 0 ${W} ${H}" class="mchart">`;
  for (let i = 0; i <= 4; i++) { const v = top * i / 4, yy = T0 + ch - ch * i / 4; s += `<line x1="${L0}" x2="${W - R0}" y1="${yy}" y2="${yy}" class="gl"/><text x="${L0 - 4}" y="${yy + 3}" class="ax" text-anchor="end">${nf(v)}</text>`; }
  data.forEach((a, i) => {
    let acc = 0; const x = L0 + cw * i + (cw - bw) / 2;
    a.forEach((v, j) => { if (v <= 0) return; const h = ch * v / top, yy = T0 + ch - ch * (acc + v) / top; s += `<rect x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h, 1).toFixed(1)}" fill="${lanes[j].color}" rx="2"/>`; acc += v; });
    if (tot[i] > 0) s += `<text x="${(x + bw / 2).toFixed(1)}" y="${(T0 + ch - ch * tot[i] / top - 4).toFixed(1)}" class="bv" text-anchor="middle">${tot[i] < 10 ? tot[i].toFixed(1) : Math.round(tot[i])}</text>`;
    s += `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 5}" class="ax" text-anchor="middle">${i + 1}</text>`;
  });
  return s + '</svg>';
}

  <section class="card" style="padding-top:6px">${rows || '<div class="empty">{記録|きろく}がありません</div>'}</section>`;

function vYear() {
  const y = ST.y, td = today(), yrs = recsWhere(ST.who, r => r.d.startsWith(String(y)));
  const daysDone = new Set(yrs.map(r => r.d)).size;
  let blocks = '';

    let c = WD.map(w => `<span class="w">${w}</span>`).join('');
    for (let i = 0; i < off; i++) c += '<i class="e"></i>';

/* --- 写真の保存場所(端末のIndexedDB+クラウド) --- */
const IDB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('odaimoku-photos' + (LOCAL_ONLY ? '-test' : ''), 1);
      r.onupgradeneeded = () => r.result.createObjectStore('p');
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async get(k) { try { const d = await this.open(); return await new Promise(res => { const q = d.transaction('p').objectStore('p').get(k); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); } catch (e) { return null; } },
  async set(k, v) { try { const d = await this.open(); return await new Promise(res => { const t = d.transaction('p', 'readwrite'); t.objectStore('p').put(v, k); t.oncomplete = () => res(true); t.onerror = () => res(false); }); } catch (e) { return false; } },
  async del(k) { try { const d = await this.open(); return await new Promise(res => { const t = d.transaction('p', 'readwrite'); t.objectStore('p').delete(k); t.oncomplete = () => res(true); t.onerror = () => res(false); }); } catch (e) { return false; } },
};
const PHC = {};
async function getPhoto(key) {
  if (PHC[key]) return PHC[key];
  let v = await IDB.get(key);
  if (!v && MODE === 'cloud' && fs && db) {
    try { const sn = await fs.getDoc(fs.doc(db, COL, key)); if (sn.exists()) { v = sn.data().d; IDB.set(key, v); } } catch (e) { console.warn(e); }
  }
  if (v) PHC[key] = v;
  return v;
}
async function putPhoto(key, data) {
  PHC[key] = data; await IDB.set(key, data);
  if (MODE === 'cloud') fs.setDoc(fs.doc(db, COL, key), { d: data, at: Date.now() }).catch(() => queue({ t: 'photo', key }));
  else queue({ t: 'photo', key });
}
function delPhoto(key) {
  delete PHC[key]; IDB.del(key);
  if (MODE === 'cloud') fs.deleteDoc(fs.doc(db, COL, key)).catch(() => queue({ t: 'pdel', key }));
  else queue({ t: 'pdel', key });
}
async function hydratePhotos(root) {
  const imgs = (root || document).querySelectorAll('img[data-ph]:not([data-ok])');
  for (const im of imgs) {
    im.dataset.ok = '1';
    (async () => {
      if (im.dataset.fb) { const t = await getPhoto(im.dataset.fb); if (t && !im.src) im.src = t; }
      const v = await getPhoto(im.dataset.ph);
      if (v) im.src = v; else if (!im.src) im.classList.add('noimg');
    })();
  }
}
async function fileToJpeg(file, max, q0, limit) {
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) { bmp = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); }); }
  const W = bmp.width, H = bmp.height; let m = max, q = q0, out = null, cw = W, ch = H;
  for (let i = 0; i < 8; i++) {
    const sc = Math.min(1, m / Math.max(W, H)); cw = Math.round(W * sc); ch = Math.round(H * sc);
    const c = document.createElement('canvas'); c.width = cw; c.height = ch;
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cw, ch); g.drawImage(bmp, 0, 0, cw, ch);
    out = c.toDataURL('image/jpeg', q);
    if (out.length <= limit) break;
    if (q > 0.62) q -= 0.08; else m = Math.round(m * 0.85);
  }
  return { data: out, w: cw, h: ch };
}

/* --- ことばの整え --- */
const FILLER = '(?:えーっと|えーと|えっと|ええと|えー+|え〜+|あのー+|あの〜|あのう|あの|あー+|うーん|うーむ|まあ|まぁ|なんか|そのー+|ほら)';
function cleanSpeech(s) {
  s = String(s || '').normalize('NFKC').replace(/\s+/g, ' ').trim();
  const F = new RegExp('(^|[\\s、。])' + FILLER + '(?=[\\s、。]|$)', 'g');
  let prev; do { prev = s; s = s.replace(F, '$1'); } while (s !== prev);
  s = s.replace(new RegExp('^' + FILLER + '[、\\s]*'), '');
  s = s.replace(/(?<=[^\x00-\x7F])\s+|\s+(?=[^\x00-\x7F])/g, '');
  s = s.replace(/^(?:御祈念|ご祈念|ごきねん|祈念)(?:項目)?(?:に|で|は|の)?/, '');
  s = s.replace(/(?:って感じ|みたいな感じ|みたいな|かなあ|かなー|かな)$/, '');
  s = s.replace(/^[、。\s]+|[、。\s]+$/g, '');
  return s;
}
const KNUM = '〇一二三四五六七八九十百千';
function kanjiNum(str) {
  const d = { '〇': 0, '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9 }, u = { '十': 10, '百': 100, '千': 1000 };
  let total = 0, cur = 0;
  for (const ch of str) { if (ch in d) cur = cur * 10 + d[ch]; else { total += (cur || 1) * u[ch]; cur = 0; } }
  return total + cur;
}
const norm = s => String(s || '').normalize('NFKC').replace(new RegExp('[' + KNUM + ']+', 'g'), m => String(kanjiNum(m))).replace(/[\s、。・,.!！?？「」『』()（）]/g, '');
function dice(a, b) {
  if (!a || !b) return 0; if (a === b) return 1;
  const bg = x => { const m = new Map(); for (let i = 0; i < x.length - 1; i++) { const k = x.slice(i, i + 2); m.set(k, (m.get(k) || 0) + 1); } return m; };
  const A = bg(a), B = bg(b); let inter = 0;
  for (const [k, v] of A) inter += Math.min(v, B.get(k) || 0);
  const n = Math.max(1, a.length - 1) + Math.max(1, b.length - 1);
  return 2 * inter / n;
}

/* --- 分類の提案 --- */
const CAT_WORDS = { work: ['仕事', 'しごと'], self: ['自分', 'じぶん'], family: ['家族', 'かぞく'], others: ['周囲の人', '周りの人', 'まわりの人', '周囲', 'しゅうい'] };
const catFromWord = w => { w = norm(w); for (const [k, arr] of Object.entries(CAT_WORDS)) if (arr.some(x => norm(x) === w)) return k; return null; };
const CAT_KW = {
  work: [['売上', 2], ['粗利', 2], ['利益', 2], ['新規', 2], ['開拓', 2], ['契約', 2], ['受注', 2], ['会社', 2], ['仕事', 2], ['営業', 2], ['商談', 2], ['取引', 2], ['顧客', 2], ['お客', 1], ['事業', 2], ['職場', 2], ['昇進', 2], ['給料', 1], ['ボーナス', 1], ['プロジェクト', 1], ['社', 1], ['店', 1]],
  family: [['藍世', 3], ['あいせ', 3], ['妻', 3], ['夫', 3], ['パパ', 3], ['ママ', 3], ['娘', 3], ['息子', 3], ['家族', 3], ['夫婦', 3], ['家庭', 2], ['我が家', 2], ['わが家', 2], ['子ども', 2], ['子供', 2], ['両親', 2], ['実家', 2], ['お父さん', 1], ['お母さん', 1]],
  others: [['ママ友', 4], ['パパ友', 4], ['さん', 3], ['ちゃん', 2], ['くん', 2], ['社員', 3], ['部下', 3], ['同僚', 3], ['友人', 3], ['友達', 3], ['友だち', 3], ['知人', 3], ['地域', 3], ['近所', 3], ['先輩', 2], ['後輩', 2], ['御本尊', 2], ['ご本尊', 2], ['入会', 2], ['みんな', 1]],
  self: [['健康', 2], ['勉強', 2], ['学習', 2], ['資格', 2], ['診断士', 3], ['試験', 2], ['ダイエット', 2], ['体重', 2], ['運動', 2], ['腕立て', 2], ['筋トレ', 2], ['ゴルフ', 2], ['ジョギング', 2], ['ランニング', 2], ['挑戦', 2], ['人間性', 2], ['早起き', 2], ['読書', 2], ['自分', 2], ['習慣', 1], ['成長', 1]],
};
function suggestCat(t) {
  const sc = {}; for (const [k, list] of Object.entries(CAT_KW)) sc[k] = list.reduce((a, [w, n]) => a + (t.includes(w) ? n : 0), 0);
  const order = ['family', 'others', 'work', 'self'];
  let best = null; for (const k of order) if (sc[k] > 0 && (!best || sc[k] > sc[best])) best = k;
  return best;
}

/* --- 話した内容の読み取り --- */
const trimTarget = a => a.replace(/^(?:さっきの|あの|その|ご祈念の|御祈念の|祈念の)/, '').replace(/(?:っていうやつ|っていうの|というの|っていう項目|という項目|の項目|のやつ|っていう|という|の祈念|のご祈念|の御祈念)$/, '').replace(/^[「『]|[」』]$/g, '').trim();
function parseCmd(t) {
  let m;
  if ((m = t.match(/^(.+?)を(?:削除|消し|けし|消去)/))) return { type: 'del', A: trimTarget(m[1]) };
  if ((m = t.match(/^(.+?)(?:を|が|は)?(?:達成(?:済み)?に(?:して|する|変え)|叶ったことにして|叶いました|かないました|叶った$|かなった$|達成しました|達成できました|達成した$)/))) return { type: 'yes', A: trimTarget(m[1]) };
  if ((m = t.match(/^(.+?)を(.+?)に(?:変更|へんこう|変え|かえ|替え|直|なお|修正|書き換え|書きかえ|訂正|移動|移し|うつし)/))) {
    const A = trimTarget(m[1]), B = m[2].replace(/^[「『]|[」』]$/g, '');
    const c = catFromWord(B.replace(/(?:の分類|分類)$/, ''));
    return c ? { type: 'cat', A, cat: c } : { type: 'text', A, B };
  }
  if ((m = t.match(/^(.+?)(?:じゃなくて|ではなくて|じゃなく|ではなく)(.+?)(?:に(?:して|変更|変え|かえ|直|修正).*)?$/))) return { type: 'text', A: trimTarget(m[1]), B: m[2] };
  return null;
}
function parseAdd(t) {
  let cat = null, m;
  if ((m = t.match(/^(仕事|自分|家族|周囲の人|周りの人|まわりの人)(?:に|の|で|へ|は)(.+)$/))) { cat = catFromWord(m[1]); t = m[2]; }
  if ((m = t.match(/^(.+?)を(仕事|自分|家族|周囲の人|周りの人|まわりの人)(?:に|へ)(?:追加|登録|入れ)/))) { cat = catFromWord(m[2]); t = m[1]; }
  t = t.replace(/(?:を|って)?(?:追加|登録|入れ|いれ)(?:し)?(?:て|る|たい)?(?:ください|ほしい|おいて|お願い)?(?:ね|よ)?$/, '');
  t = t.replace(/^[、。\s]+|[、。\s]+$/g, '');
  return { title: t, cat };
}
function findTargets(A) {
  const mine = prayers().filter(p => p.owner === L.me);
  const nA = norm(A); if (!nA) return [];
  const hit = mine.filter(p => { const nt = norm(p.title); return nt.includes(nA) || (nt.length >= 3 && nA.includes(nt)); });
  if (hit.length) return hit;
  const chunks = nA.split(/[のがをにはでとへもや]/).filter(x => x.length >= 2);
  if (chunks.length) { const h2 = mine.filter(p => { const nt = norm(p.title); return chunks.every(c => nt.includes(c)); }); if (h2.length) return h2; }
  const sc = mine.map(p => [p, dice(nA, norm(p.title))]).filter(x => x[1] >= 0.4).sort((a, b) => b[1] - a[1]);
  if (sc.length >= 2 && sc[0][1] - sc[1][1] > 0.15) return [sc[0][0]];
  return sc.slice(0, 5).map(x => x[0]);
}
function toKanji(n) {
  const d = '〇一二三四五六七八九'; if (n === 0) return '〇'; let s = '';
  for (const [u, k] of [[1000, '千'], [100, '百'], [10, '十']]) { const q = Math.floor(n / u); if (q) { s += (q > 1 ? d[q] : '') + k; n %= u; } }
  return s + (n ? d[n] : '');
}
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function applyChange(title, A, B) {
  const m = B.match(new RegExp('^(\\d+|[' + KNUM + ']+)([^\\d' + KNUM + ']{1,4})$'));
  if (m) {
    const re = new RegExp('(\\d+|[' + KNUM + ']+)' + escRe(m[2])), tm = title.match(re);
    if (tm) {
      const n = /^\d+$/.test(m[1]) ? +m[1] : kanjiNum(m[1]);
      const num = /^\d+$/.test(tm[1]) ? String(n) : toKanji(n);
      return title.replace(re, num + m[2]);
    }
  }
  if (A && title.includes(A)) return title.replace(A, B);
  const nT = norm(title), nA = norm(A);
  if (nA && nT.includes(nA)) return nT.replace(nA, B);
  if (B.length >= Math.max(4, A.length * 0.6)) return B;
  return null;
}

const CLAUDE_REQ = `次のご祈念項目を、4分類（仕事・自分・家族・周囲の人）に整理して、お題目帳アプリに取り込める形式で出してください。
・分類ごとに「### 仕事」「### 自分」「### 家族」「### 周囲の人」の見出しをつける
・項目は1行ずつ「- [ ] 祈念チェック　[ ] 達成チェック　項目の文章」
・期日があれば行末に「｜いつまでに 2026-12-31」、お気に入りは「｜⭐」、自分だけにしたいものは「｜🔒」、くわしい説明は「｜くわしく：〜」
・私が言った文言・人数・社数などの数値は変えない。分からないものは推測で作らない
・最後に、取り込み用の部分だけをコードブロックで出す`;
function parseDate(s) {
  let m;
  if ((m = s.match(/(\d{4})[-/年.](\d{1,2})[-/月.](\d{1,2})/))) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  if ((m = s.match(/(\d{1,2})[/月](\d{1,2})日?/))) { const t = today(); let y = +t.slice(0, 4); const d = `${y}-${pad(+m[1])}-${pad(+m[2])}`; return d < t ? `${y + 1}-${pad(+m[1])}-${pad(+m[2])}` : d; }
  return '';
}
const BULLET = /^(?:[-*・•●◯○◆□▪►▶→✓✔]|\d+\s*[.)．、）:：]|[①-⑳]|[(（]\d+[)）])\s*/;
const SKIP_HEAD = /ルール|目的|指示|形式|注意|表示|更新|確認|未収録|プロジェクト|引き継ぎ|分類|使い方|流れ/;
function markDup(list) {
  const mine = prayers().filter(p => p.owner === L.me).map(p => norm(p.title));
  const seen = new Set(), out = [];
  for (const it of list) { const k = norm(it.title); if (seen.has(k)) continue; seen.add(k); it.dup = mine.includes(k); out.push(it); }
  return out;
}
function parseImport(txt) {
  const lines = String(txt).split(/\r?\n/).map(r => r.normalize('NFKC').replace(/\*\*/g, '').trim());
  const anyBullet = lines.some(l => BULLET.test(l) || /\\?\[\s*[xX✓✔]?\s*\\?\]/.test(l));
  const out = []; let cat = null, skip = false, inCode = false;
  for (let l of lines) {
    if (/^```/.test(l)) { if (inCode) { cat = null; skip = true; } inCode = !inCode; continue; }
    if (!l || /^※/.test(l)) continue;
    // 見出し
    let head = null, m;
    if ((m = l.match(/^#{1,6}\s*(.+)$/))) head = m[1];
    else if ((m = l.match(/^[【\[■◆]\s*([^】\]]{1,20}?)\s*[】\]]?\s*$/)) && !BULLET.test(l.replace(/^[■◆]/, ''))) head = m[1];
    else if (!BULLET.test(l) && (m = l.match(/^(.{1,20})[:：]$/))) head = m[1];
    else if (catFromWord(l.replace(/[\s:：]/g, ''))) head = l;
    if (head !== null) {
      head = head.replace(/^\d+[.)]\s*/, '').replace(/[:：].*$/, '').replace(/[【】\[\]]/g, '').trim();
      cat = catFromWord(head); skip = !cat && SKIP_HEAD.test(head);
      continue;
    }
    if (skip) continue;
    const isBul = BULLET.test(l) || /^\\?\[/.test(l);
    if (anyBullet && !isBul) continue;
    if (!anyBullet && (/^(?:以下|こちら|次の|上記|まとめ)/.test(l) || /[:：]$/.test(l))) continue;
    let t = l.replace(BULLET, '');
    let ach = false, pr = false;
    t = t.replace(/\\?\[\s*([xX✓✔]?)\s*\\?\]\s*(祈念|達成)(?:チェック)?/g, (m0, x, k) => { if (x) { if (k === '達成') ach = true; else pr = true; } return ''; });
    t = t.replace(/\\/g, '').replace(/^\\?\[\s*\\?\]\s*/, '');
    // 行の中の分類(「家族:〇〇」「【家族】〇〇」)
    let lineCat = null;
    if ((m = t.match(/^[【\[]\s*([^】\]]+?)\s*[】\]]\s*(.+)$/)) && catFromWord(m[1])) { lineCat = catFromWord(m[1]); t = m[2]; }
    else if ((m = t.match(/^(仕事|自分|家族|周囲の人|周りの人)\s*[:：]\s*(.+)$/))) { lineCat = catFromWord(m[1]); t = m[2]; }
    const parts = t.split(/[｜|]/).map(x => x.trim());
    const title = parts.shift().replace(/^[　\s]+|[　\s]+$/g, '');
    if (!title || title === '項目の文章') continue;
    const c = lineCat || cat;
    const it = { cat: c || suggestCat(title), sug: !c, title, due: '', fav: false, vis: 'family', body: '', ach, pr };
    if (!c && !it.cat) it.sug = false;
    for (const x of parts) {
      if (/⭐|★|お気に入り/.test(x)) it.fav = true;
      else if (/🔒|自分だけ/.test(x)) it.vis = 'me';
      else if (/^くわしく[:：]?/.test(x)) it.body = x.replace(/^くわしく[:：]?\s*/, '');
      else if (/達成/.test(x)) it.ach = true;
      else if (parseDate(x)) it.due = parseDate(x);
    }
    out.push(it);
  }
  return markDup(out);
}

    <label class="fl">メモ(なくてもOK)</label><input type="text" id="fMemo" maxlength="100" value="${esc(v.memo || '')}">
    <div class="mbtns">${r ? `<button class="del" data-act="recdel" data-v="${r.id}">{削除|さくじょ}</button>` : ''}<button data-act="mclose">やめる</button><button class="pri" data-act="recsave" data-v="${r ? r.id : ''}">{保存|ほぞん}</button></div>`);
  calcHen();
}
function fSec() { return Math.max(0, (parseInt(document.getElementById('fM').value) || 0) * 60 + Math.min(59, parseInt(document.getElementById('fSec').value) || 0)); }
function calcHen() { const el = document.getElementById('fHen'); if (el) el.innerHTML = T(`= ${fmtHen(hen(fSec(), FWHO), true)}`); }
function recSave(id) {
  const sec = fSec(), d = document.getElementById('fD').value, s = document.getElementById('fS').value;
  if (!d || !/^\d{4}-\d\d-\d\d$/.test(d)) return toast('{日|ひ}にちを{入|い}れてね');
  if (!s) return toast('{時刻|じこく}を{入|い}れてね');
  if (sec < 1) return toast('{時間|じかん}を{入|い}れてね');
  const old = id ? RECS.find(x => x.id === id) : null;
  const rec = { who: FWHO, d, s: s.slice(0, 5), sec, memo: document.getElementById('fMemo').value.trim(), m: old ? !!old.m : true, at: old ? (old.at || Date.now()) : Date.now(), ed: Date.now() };
  const rid = id || newId();
  if (old && recDoc(old) !== recDoc(rec)) op({ t: 'del', doc: recDoc(old), path: `recs.${rid}` }, true);
  op({ t: 'merge', doc: recDoc(rec), data: { recs: { [rid]: rec } } }, true);
  closeModal(); ST.sel = d; ST.ym = d.slice(0, 7); render();
  toast(old ? '{直|なお}しました' : '{追加|ついか}しました');
}
function prayModal(id, cat, pre) {
  const p = id ? prayers().find(x => x.id === id) : null;
  const v = p || { title: (pre && pre.title) || '', body: '', due: '', vis: 'family', status: 'praying', result: '', cat: cat || '', fav: false };
  openModal(`<h3>${p ? '{御祈念|ごきねん}{項目|こうもく}を{直|なお}す' : '{御祈念|ごきねん}{項目|こうもく}をつくる'}</h3>
    ${pre && pre.heard ? `<div class="heard">🎤「${esc(pre.heard)}」</div>` : ''}
    <label class="fl">{分類|ぶんるい}</label>
    <div class="note" id="pSug" style="margin:-2px 0 6px">${pre && pre.suggested ? `💡 「${catOf(v.cat).name}」をおすすめしました。ちがうときは{選|えら}びなおしてね` : (pre && pre.heard && !v.cat ? '{分類|ぶんるい}を{選|えら}んでね' : '')}</div>
    <div class="catsel" id="pC">${CATS.map(c => `<button class="${v.cat === c.id ? 'on' : ''}" data-act="pcat" data-v="${c.id}"><span>${c.icon}</span>${c.name}</button>`).join('')}</div>
    <label class="fl fmic">ねがい<button class="mini" data-act="vdict" data-v="pT">🎤 {話|はな}して{入力|にゅうりょく}</button></label><input type="text" id="pT" maxlength="120" value="${esc(v.title)}" placeholder="${plain('{例|れい}:{家族|かぞく}みんなが{健康|けんこう}でいられますように')}">
     <label class="fl fmic">くわしく({自由|じゆう}に{書|か}いてね)<button class="mini" data-act="vdict" data-v="pB">🎤</button></label><textarea id="pB" maxlength="1000">${esc(v.body || '')}</textarea>
    <label class="fl">いつまでに</label>
    <div class="durin"><input type="date" id="pD" value="${v.due || ''}" style="width:auto!important;flex:1"><button class="btn2" style="margin:0" data-act="pdclear">きめない</button></div>
    <label class="fl">だれに{見|み}せる?</label>
    <div class="wseg plain" id="pV"><button class="${v.vis === 'family' ? 'on' : ''}" data-act="pvis" data-v="family">👪 {家族|かぞく}で{見|み}る</button><button class="${v.vis !== 'family' ? 'on' : ''}" data-act="pvis" data-v="me">🔒 {自分|じぶん}だけ</button></div>
    <button class="tg" data-act="pfavm" id="pF" data-on="${v.fav ? 1 : 0}"><span class="sw ${v.fav ? 'on' : ''}"></span>⭐ お{気|き}に{入|い}りにする</button>
    ${p ? `<label class="fl">けっか</label>
    <div class="wseg plain" id="pS">${['praying', 'yes', 'no'].map(k => `<button class="${v.status === k ? 'on' : ''}" data-act="pst" data-v="${k}">${STATUS[k]}</button>`).join('')}</div>
    <label class="fl">ふりかえりメモ(なくてもOK)</label><textarea id="pR" maxlength="1000" style="min-height:60px">${esc(v.result || '')}</textarea>
    <p class="note">🙏 これまで{祈念|きねん}した{日|ひ}:${daysRb(prayedDays(p))}</p>` : ''}
    <div class="mbtns">${p ? `<button class="del" data-act="pdel" data-v="${p.id}">{削除|さくじょ}</button>` : ''}<button data-act="mclose">やめる</button><button class="pri" data-act="psave" data-v="${p ? p.id : ''}">{保存|ほぞん}</button></div>`);
}
function prayView(id) {
  const p = prayers().find(x => x.id === id); if (!p) return;
  const o = P(p.owner), c = catOf(p.cat);
  openModal(`<h3>${o.emoji} ${o.rb}の{御祈念|ごきねん}</h3>
    <div class="note" style="margin:0">${c.icon} ${c.name}</div>
    <h4 style="margin:6px 0;font-size:17px">${esc(p.title)}</h4>
    ${p.body ? `<div style="white-space:pre-wrap;font-size:14px">${esc(p.body)}</div>` : ''}
    ${p.due ? `<div class="note">${dueTxt(p)}</div>` : ''}
    <div class="note">🙏 {祈念|きねん}した{日|ひ} ${daysRb(prayedDays(p))}・${STATUS[p.status] || ''}${p.doneAt ? `(${dateRb(p.doneAt)})` : ''}</div>
    ${p.result ? `<div class="note">${esc(p.result)}</div>` : ''}
    <div class="mbtns"><button data-act="mclose">とじる</button></div>`);
}
function segVal(id) { const b = document.querySelector(`#${id} button.on`); return b ? b.dataset.v : null; }
function prayerSave(id) {
  const cat = segVal('pC');
  if (!cat) return toast('{分類|ぶんるい}を{選|えら}んでね');
  const title = document.getElementById('pT').value.trim();
  if (!title) return toast('ねがいを{書|か}いてね');
  const old = id ? prayers().find(x => x.id === id) : null;
  const status = old ? (segVal('pS') || 'praying') : 'praying';
  const item = {
    owner: old ? old.owner : L.me, cat, fav: document.getElementById('pF').dataset.on === '1',
    title, body: document.getElementById('pB').value.trim(),
    due: document.getElementById('pD').value || '', vis: segVal('pV') || 'family', status,
    result: old ? document.getElementById('pR').value.trim() : '',
    doneAt: status === 'praying' ? '' : ((old && old.status === status && old.doneAt) || today()),
    created: old ? old.created || Date.now() : Date.now(), upd: Date.now()
  };
  op({ t: 'merge', doc: 'prayers', data: { items: { [id || newId()]: item } } }, true);
  closeModal(); render();
  if (status === 'yes' && (!old || old.status !== 'yes')) celebrate(); else toast('{保存|ほぞん}しました');
}
function celebrate() {
  const c = document.createElement('div'); c.className = 'confetti';
  const em = ['🎉', '🌸', '✨', '🎊', '💐'];
  for (let i = 0; i < 28; i++) { const s = document.createElement('span'); s.textContent = em[i % em.length]; s.style.left = Math.random() * 100 + 'vw'; s.style.animationDelay = Math.random() * .6 + 's'; c.appendChild(s); }
  document.body.appendChild(c); setTimeout(() => c.remove(), 2600);
  toast('おめでとう! 🎉');
}

/* ---------- トースト ---------- */
let toastT = null;
function toast(msg) { const t = document.getElementById('toast'); t.innerHTML = T(msg); t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

/* ============================================================
   操作
   ============================================================ */
const ACT = {
  tab: el => { CUR = el.dataset.v; window.scrollTo(0, 0); render(); },
  who: () => whoModal(),
  setme: el => {
    const was = L.me; L.me = el.dataset.v; saveL(); seedPrayers();
    if (was && was !== L.me && TS.running) { tStop(); }
    if (ST.who === was || !ST.who) ST.who = L.me;
    closeModal();
    renderHeader(); render();
  },
  mclose: () => closeModal(),
  startstop: () => TS.running ? tStop() : tStart(),
  reset: () => tReset(),
  save: () => tSave(),
  mode: el => {
    if (TS.mode === el.dataset.v) return;
    if (elapsed() > 0) return toast('リセットか{保存|ほぞん}をしてから{切|き}りかえてね');
    TS.mode = el.dataset.v; saveTS(); render();
  },
  target: el => {
    if (elapsed() > 0) return toast('リセットか{保存|ほぞん}をしてから{変|か}えてね');
    let v = el.dataset.v;
    if (v === 'custom') { const a = prompt('なん分にしますか?(1〜300)', TS.target); if (a === null) return; v = parseInt(a); if (!(v >= 1 && v <= 300)) return toast('1〜300で{入|い}れてね'); }
    TS.target = +v; saveTS(); render();
  },
  sound: () => { L.sound = !L.sound; saveL(); ensureAudio(); render(); },
  famgo: el => { ST.who = el.dataset.v; ST.sub = 'day'; ST.sel = today(); ST.ym = today().slice(0, 7); CUR = 'stats'; window.scrollTo(0, 0); render(); },
  swho: el => { ST.who = el.dataset.v; render(); },
  ssub: el => { ST.sub = el.dataset.v; render(); },
  ymnav: el => { const [y, m] = ST.ym.split('-').map(Number); const d = new Date(y, m - 1 + (+el.dataset.v), 1); ST.ym = ymd(d).slice(0, 7); render(); },
  ynav: el => { ST.y += +el.dataset.v; render(); },
  selday: el => {
    ST.sel = el.dataset.v; ST.ym = ST.sel.slice(0, 7); render();
    const dd = document.getElementById('daydetail'); if (dd) dd.scrollIntoView({ behavior: 'smooth', block: 'start' });
  },
  yday: el => { ST.sel = el.dataset.v; ST.ym = ST.sel.slice(0, 7); ST.sub = 'day'; render(); const dd = document.getElementById('daydetail'); if (dd) dd.scrollIntoView({ block: 'start' }); },
  gomonth: el => { ST.ym = el.dataset.v; ST.sub = 'day'; window.scrollTo(0, 0); render(); },
  sort: () => { ST.desc = !ST.desc; render(); },
  quick: el => {
    const td = today(), v = el.dataset.v;
    if (v === 'tm') { ST.from = td.slice(0, 8) + '01'; ST.to = td; }
    if (v === 'lm') { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1); ST.from = ymd(d); const e = new Date(d.getFullYear(), d.getMonth() + 1, 0); ST.to = ymd(e); }
    if (v === 'ty') { ST.from = td.slice(0, 4) + '-01-01'; ST.to = td; }
    if (v === 'all') { ST.from = RECS.length ? RECS[0].d : td; ST.to = td; }
    render();
  },
  addrec: el => recModal(null, el.dataset.v),
  editrec: el => recModal(el.dataset.v),
  fwho: el => { FWHO = el.dataset.v; document.querySelectorAll('#fwho button').forEach(b => b.classList.toggle('on', b === el)); },
  recsave: el => recSave(el.dataset.v),
  recdel: el => {
    const r = RECS.find(x => x.id === el.dataset.v); if (!r) return;
    if (!confirm('この記録を削除しますか?')) return;
    op({ t: 'del', doc: recDoc(r), path: `recs.${r.id}` }, true); closeModal(); render(); toast('{削除|さくじょ}しました');
  },
  rate: el => setRate(el.dataset.who, +el.dataset.v),
  wnew: () => wordModal(null),
  wopen: el => wordView(el.dataset.v),
  wedit: el => wordModal(el.dataset.v),
  wcatf: el => { WST.cat = el.dataset.v; render(); },
  wfam: () => { WST.fam = !WST.fam; render(); },
  wcat: el => document.querySelectorAll('#wC button').forEach(b => b.classList.toggle('on', b === el)),
  wvis: el => document.querySelectorAll('#wV button').forEach(b => b.classList.toggle('on', b === el)),
  wcam: () => document.getElementById('wCam').click(),
  wpick: () => document.getElementById('wPick').click(),
  wphdel: () => { if (!WEDIT) return; WEDIT.newPhoto = null; WEDIT.removePhoto = true; document.getElementById('wPh').innerHTML = T('<div class="wph0">{写真|しゃしん}なし</div>'); document.getElementById('wPhDel').style.display = 'none'; },
  wsave: () => wordSave(),
  wdel: el => {
    const w = words().find(x => x.id === el.dataset.v); if (!w) return;
    if (!confirm('この言葉を削除しますか?')) return;
    if (w.photo) { delPhoto('zz_p_' + w.id); delPhoto('zz_t_' + w.id); }
    op({ t: 'del', doc: 'words', path: `items.${w.id}` }, true); WEDIT = null; closeModal(); render(); toast('{削除|さくじょ}しました');
  },
  wcopy: el => { const w = words().find(x => x.id === el.dataset.v); if (w) copyNow(w.memo); },
  wzoom: el => openViewer(el.dataset.v),
  vwzoom: () => document.querySelector('#viewer .vwin').classList.toggle('big'),
  vwclose: () => { const v = document.getElementById('viewer'); v.classList.remove('on'); v.innerHTML = ''; },
  voice: () => voiceModal(),
  vmic: () => { if (REC) stopRec(false); else vStart(true); },
  vgo: () => vGo(),
  vpick: el => { VC.pick = el.dataset.v; vChangeModal(); },
  vapply: () => vApply(),
  vdict: el => { if (REC) { stopRec(false); return; } vDictate(el); },
  imp: () => importModal(),
  impread: () => importPreview(),
  impsave: () => importSave(),
  impreq: () => copyModal('Claudeへのお{願|ねが}い{文|ぶん}', CLAUDE_REQ),
  exp: () => copyModal('📤 {一覧|いちらん}(Claudeに{渡|わた}す{用|よう})', exportText()),
  cpgo: () => copyNow(document.getElementById('cpTx').value),
  pfavf: el => { PR.fav = el.dataset.v === '1'; render(); },
  pfam: () => { PR.fam = !PR.fam; render(); },
  pdone: () => { PR.done = !PR.done; render(); },
  pnew: el => { if (!L.me) return whoModal(); prayModal(null, el.dataset.v); },
  pedit: el => prayModal(el.dataset.v),
  pview: el => prayView(el.dataset.v),
  pcat: el => document.querySelectorAll('#pC button').forEach(b => b.classList.toggle('on', b === el)),
  pfavm: el => { const on = el.dataset.on !== '1'; el.dataset.on = on ? '1' : '0'; el.querySelector('.sw').classList.toggle('on', on); },
  pvis: el => document.querySelectorAll('#pV button').forEach(b => b.classList.toggle('on', b === el)),
  pst: el => document.querySelectorAll('#pS button').forEach(b => b.classList.toggle('on', b === el)),
  pdclear: () => { document.getElementById('pD').value = ''; },
  psave: el => prayerSave(el.dataset.v),
  pdel: el => {
    if (!confirm('この御祈念項目を削除しますか?')) return;
    op({ t: 'del', doc: 'prayers', path: `items.${el.dataset.v}` }, true); closeModal(); render(); toast('{削除|さくじょ}しました');
  },
  pray1: el => {
    const p = prayers().find(x => x.id === el.dataset.v); if (!p) return;
    const k = dkey(today());
    if (prayedOn(p, today())) op({ t: 'del', doc: 'prayers', path: `items.${p.id}.pd.${k}` });
    else op({ t: 'merge', doc: 'prayers', data: { items: { [p.id]: { pd: { [k]: true } } } } });
  },
  pach: el => {
    const p = prayers().find(x => x.id === el.dataset.v); if (!p) return;
    const yes = p.status !== 'yes';
    op({ t: 'merge', doc: 'prayers', data: { items: { [p.id]: { status: yes ? 'yes' : 'praying', doneAt: yes ? today() : '', upd: Date.now() } } } });
    if (yes) celebrate();
  },
  pfav: el => {
    const p = prayers().find(x => x.id === el.dataset.v); if (!p) return;
    op({ t: 'merge', doc: 'prayers', data: { items: { [p.id]: { fav: !p.fav } } } });
  },
  furi: el => { L.furi = el.dataset.v === '1'; saveL(); renderHeader(); render(); },
  snd: el => { L.sound = el.dataset.v === '1'; saveL(); render(); },
  bkdl: () => {
    const blob = new Blob([JSON.stringify({ app: 'odaimoku-cho', ver: 1, at: new Date().toISOString(), docs: DOCS }, null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `odaimoku-backup-${today().replace(/-/g, '')}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  },
  bkup: () => document.getElementById('bkfile').click(),
};
const CHG = {
  from: el => { if (el.value) { ST.from = el.value; el.blur(); render(); } },
  to: el => { if (el.value) { ST.to = el.value; el.blur(); render(); } },
  rate: el => { const v = parseInt(el.value); if (v >= 1 && v <= 300) { el.blur(); setRate(el.dataset.who, v); } else if (el.value) toast('1〜300で{入|い}れてね'); },
  goal: el => { const v = parseInt(el.value); if (v >= 0 && v <= 600) { L.goal = v; saveL(); } },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el, e); }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-chg]'); if (el && CHG[el.dataset.chg]) CHG[el.dataset.chg](el);
  if ((e.target.id === 'wCam' || e.target.id === 'wPick') && e.target.files[0]) { wordPhotoChosen(e.target.files[0]); e.target.value = ''; }
  if (e.target.id === 'bkfile' && e.target.files[0]) {
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const j = JSON.parse(rd.result); if (!j || j.app !== 'odaimoku-cho' || !j.docs) throw 0;
        if (!confirm('バックアップの記録を取りこみますか?(いまの記録は消えず、足し合わせます)')) return;
        for (const [id, data] of Object.entries(j.docs)) if (id.startsWith('rec_') || id === 'prayers' || id === 'words' || id === 'settings') op({ t: 'merge', doc: id, data }, true);
        render(); toast('{復元|ふくげん}しました');
      } catch (er) { toast('ファイルが{読|よ}めませんでした'); }
    };
    rd.readAsText(e.target.files[0]); e.target.value = '';
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'fM' || e.target.id === 'fSec') calcHen();
  if (e.target.id === 'wQ') { WST.q = e.target.value; const l = document.getElementById('wlist'); if (l) { l.innerHTML = T(wordList()); hydratePhotos(l); } }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { if (TS.running) wake(true); render(); } });

/* ---------- 起動 ---------- */
rebuild(); if (LOCAL_ONLY) seedPrayers(); renderHeader(); render();
if (!L.me) whoModal();
initFirebase();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
window.__od = { words, IDB, PHC, splitSpoken, cleanSpeech, parseCmd, parseAdd, suggestCat, applyChange, findTargets, parseImport, exportText, get DOCS() { return DOCS; }, get RECS() { return RECS; }, TS, L, get MODE() { return MODE; } };
</script>
</body>
